services:
  postgres:
    image: postgres:15-alpine
    container_name: bookstore-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bookstore_admin -d bookstore" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

  app:
    build: .
    container_name: bookstore-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
