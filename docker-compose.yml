services:
  postgres:
    image: postgres:15-alpine
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookstore_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookstore
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bookstore_admin -d bookstore" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bookstore-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/srv/data
    env_file:
      - .env
    environment:
      # This points to the Docker service name 'postgres' instead of 'localhost'
      - DATABASE_URL=postgresql+psycopg://bookstore_admin:secure_password_here@postgres:5432/bookstore
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
